body {

    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
    overflow-x: hidden;
}

/* Fondo animado */
.background {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(
            ellipse at 20% 40%,
            rgba(0, 75, 255, 0.20),
            transparent 50%

        radial-gradient(
            ellipse at 80% 40%,
            rgba(255, 0, 30, 0.20),
            transparent 50%

}

/* Luces rojas y azules */
.lights {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 8px;
    display: flex;
    z-index: -1;
}

.light {
    width: 50%;
    height: 100%;
    animation: flash 1.2s infinite alternate;
}

.blue {
    background: #087bff;
    box-shadow: 0 0 35px 15px rgba(0, 90, 255, 0.45);
}

.red {
    background: #ff1838;
    box-shadow: 0 0 35px 15px rgba(255, 0, 35, 0.40);
    animation-delay: 0.6s;
}

@keyframes flash {
    0%, 35% {
        opacity: 1;
    }

    36%, 100% {
        opacity: 0.15;
    }
}

/* Contenedor principal */
.container {
    width: 100%;
    max-width: 850px;
    background: rgba(10, 14, 25, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.12);

        0 0 50px rgba(0, 75, 255, 0.12),
        0 0 50px rgba(255, 0, 35, 0.10);
    animation: appear 1s ease-out;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Encabezado */
.header {

    background: linear-gradient(
        120deg,
        rgba(0, 75, 255, 0.18),

}
